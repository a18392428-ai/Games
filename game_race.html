<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>سباق السيارات الاحترافي</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #startModal, #resultModal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        #startModal h1 { font-size: 32px; margin-bottom: 10px; color: #f1c40f; }
        #startModal label { font-size: 18px; margin-bottom: 15px; }
        #lapSelect {
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 10px;
            border: none;
            margin-bottom: 25px;
            background: #fff;
            color: #333;
            font-weight: bold;
        }
        .btn-action {
            padding: 12px 35px;
            font-size: 20px;
            font-weight: bold;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.4);
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
        }

        #countdownOverlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 90px;
            font-weight: 900;
            color: #f1c40f;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            z-index: 50;
            pointer-events: none;
            display: none;
        }

        #resultEmoji { font-size: 80px; margin: 15px 0; animation: bounce 1s infinite alternate; }
        #resultTitle { font-size: 32px; font-weight: bold; margin-bottom: 10px; }
        #resultMessage { font-size: 20px; color: #ddd; margin-bottom: 20px; }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }

        #hud {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            width: 90%;
            max-width: 500px;
        }
        .hud-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 8px;
        }
        .hud-card {
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 8px 12px;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            flex: 1;
        }
        .hud-card span { color: #f1c40f; }

        .back-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 20;
            background: rgba(231, 76, 60, 0.85);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .controls-container {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 10;
        }
        .control-group { display: flex; gap: 12px; }
        .btn {
            width: 75px;
            height: 70px;
            border: 2px solid #fff;
            border-radius: 16px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 5px 12px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .btn-steer { background: rgba(52, 152, 219, 0.85); }
        .btn-gas { background: rgba(46, 204, 113, 0.85); }
        .btn-brake { background: rgba(231, 76, 60, 0.85); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="startModal">
        <h1>🏁 سباق المحترفين</h1>
        <label for="lapSelect">اختر عدد اللفات:</label>
        <select id="lapSelect">
            <option value="3">3 لفات (سريع)</option>
            <option value="5" selected>5 لفات (قياسي)</option>
            <option value="7">7 لفات</option>
            <option value="10">10 لفات (تحدي)</option>
        </select>
        <button class="btn-action" onclick="prepareRace()">ابدأ السباق 🚀</button>
    </div>

    <div id="resultModal" style="display: none;">
        <div id="resultEmoji">🥳👉🏆</div>
        <div id="resultTitle">المركز الأول!</div>
        <div id="resultMessage">أداء أسطوري!</div>
        <a href="game_race.html" class="btn-action">إعادة السباق 🔄</a>
        <a href="index.html" class="btn-action" style="background:#e74c3c;">القائمة الرئيسية 🏠</a>
    </div>

    <div id="countdownOverlay">3</div>

    <a href="index.html" class="back-btn">القائمة</a>

    <div id="hud">
        <div class="hud-row">
            <div class="hud-card">المركز: <span id="posVal">1 / 4</span></div>
            <div class="hud-card">اللفة: <span id="lapVal">1 / 5</span></div>
            <div class="hud-card">السرعة: <span id="speedVal">0 كم/س</span></div>
        </div>
    </div>

    <div class="controls-container">
        <div class="control-group">
            <button class="btn btn-steer" id="leftBtn">◀</button>
            <button class="btn btn-steer" id="rightBtn">▶</button>
        </div>
        <div class="control-group">
            <button class="btn btn-brake" id="brakeBtn">⬇</button>
            <button class="btn btn-gas" id="gasBtn">⬆</button>
        </div>
    </div>

<script>
let scene, camera, renderer;
let playerCar;
let aiCars = [];
let trafficLightLights = [];

let raceStarted = false;

let currentLap = 1;
let totalLaps = 5;
let playerProgress = 0;
let lastPlayerAngle = 0;
let playerRank = 1;

let speed = 0;
let maxSpeed = 1.5;
let acceleration = 0.022;
let friction = 0.988;

let isGas = false, isBrake = false, moveLeft = false, moveRight = false;

const innerRadius = 120;
const outerRadius = 180;
const trackRadius = (innerRadius + outerRadius) / 2;

function prepareRace() {
    totalLaps = parseInt(document.getElementById('lapSelect').value);
    document.getElementById('lapVal').innerText = "1 / " + totalLaps;
    document.getElementById('startModal').style.display = 'none';
    startCountdown();
}

function startCountdown() {
    const cdEl = document.getElementById('countdownOverlay');
    cdEl.style.display = 'block';
    
    let count = 3;
    cdEl.innerText = count;
    trafficLightLights[0].material.color.setHex(0xff0000);

    let timer = setInterval(() => {
        count--;
        if (count === 2) {
            cdEl.innerText = "2";
            trafficLightLights[1].material.color.setHex(0xffff00);
        } else if (count === 1) {
            cdEl.innerText = "1";
        } else if (count === 0) {
            cdEl.innerText = "GO! 🏁";
            trafficLightLights[2].material.color.setHex(0x00ff00);
            raceStarted = true;
        } else {
            clearInterval(timer);
            cdEl.style.display = 'none';
        }
    }, 1000);
}

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 150, 600);

    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(100, 200, 100);
    dirLight.castShadow = true;
    scene.add(dirLight);

    buildTrackAndEnvironment();

    const startX = trackRadius;
    const laneOffsets = [-15, -5, 5, 15];

    // سيارة اللاعب
    playerCar = createDetailedCar(0xe74c3c);
    playerCar.position.set(startX + laneOffsets[2], 0.35, 0);
    playerCar.rotation.y = Math.PI / 2;
    scene.add(playerCar);

    lastPlayerAngle = Math.atan2(playerCar.position.z, playerCar.position.x);

    // سيارات الـ AI المنافسة
    const aiColors = [0x3498db, 0xf1c40f, 0x9b59b6];
    let aiIndex = 0;
    for (let i = 0; i < 4; i++) {
        if (i === 2) continue;
        let aiCar = createDetailedCar(aiColors[aiIndex]);
        aiCar.position.set(startX + laneOffsets[i], 0.35, 0);
        aiCar.rotation.y = Math.PI / 2;
        aiCar.laneRadius = startX + laneOffsets[i];
        aiCar.aiAngle = 0;
        aiCar.aiSpeed = 0.006 + Math.random() * 0.0015;
        scene.add(aiCar);
        aiCars.push(aiCar);
        aiIndex++;
    }

    setupControls();
    window.addEventListener('resize', onWindowResize);
    animate();
}

function createDetailedCar(colorHex) {
    const carGroup = new THREE.Group();
    const mainMat = new THREE.MeshPhongMaterial({ color: colorHex, shininess: 100 });
    const glassMat = new THREE.MeshPhongMaterial({ color: 0x111111, transparent: true, opacity: 0.85 });

    const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.65, 4.0), mainMat);
    body.position.y = 0.45;
    body.castShadow = true;
    carGroup.add(body);

    const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.6, 2.2), glassMat);
    cabin.position.set(0, 0.95, -0.2);
    carGroup.add(cabin);

    const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.35, 16);
    const wheelMat = new THREE.MeshPhongMaterial({ color: 0x1a1a1a });
    const wheelPositions = [[-1.1, 0.42, 1.2], [1.1, 0.42, 1.2], [-1.1, 0.42, -1.2], [1.1, 0.42, -1.2]];

    carGroup.wheels = [];
    wheelPositions.forEach(pos => {
        const wheelPivot = new THREE.Group();
        wheelPivot.position.set(...pos);
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.rotation.z = Math.PI / 2;
        wheelPivot.add(wheel);
        carGroup.add(wheelPivot);
        carGroup.wheels.push(wheel);
    });

    return carGroup;
}

function buildTrackAndEnvironment() {
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(1200, 1200),
        new THREE.MeshLambertMaterial({ color: 0x27ae60 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    const track = new THREE.Mesh(
        new THREE.RingGeometry(innerRadius, outerRadius, 128),
        new THREE.MeshLambertMaterial({ color: 0x333333, side: THREE.DoubleSide })
    );
    track.rotation.x = -Math.PI / 2;
    track.position.y = 0.02;
    scene.add(track);

    const fenceMatInner = new THREE.MeshPhongMaterial({ color: 0xe74c3c, side: THREE.DoubleSide });
    const innerFence = new THREE.Mesh(new THREE.CylinderGeometry(innerRadius, innerRadius, 1.8, 128, 1, true), fenceMatInner);
    innerFence.position.y = 0.9;
    scene.add(innerFence);

    const fenceMatOuter = new THREE.MeshPhongMaterial({ color: 0xecf0f1, side: THREE.DoubleSide });
    const outerFence = new THREE.Mesh(new THREE.CylinderGeometry(outerRadius, outerRadius, 1.8, 128, 1, true), fenceMatOuter);
    outerFence.position.y = 0.9;
    scene.add(outerFence);

    const finishLine = new THREE.Mesh(
        new THREE.PlaneGeometry(outerRadius - innerRadius, 6),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    finishLine.rotation.x = -Math.PI / 2;
    finishLine.position.set(trackRadius, 0.03, 0);
    scene.add(finishLine);

    createTrafficLight();

    for (let i = 0; i < 20; i++) {
        let angle = (i / 20) * Math.PI * 2;
        let mountain = new THREE.Mesh(
            new THREE.ConeGeometry(30 + Math.random() * 20, 50, 8),
            new THREE.MeshLambertMaterial({ color: 0x7f8c8d })
        );
        mountain.position.set(Math.cos(angle) * (outerRadius + 80), 25, Math.sin(angle) * (outerRadius + 80));
        scene.add(mountain);
    }
}

function createTrafficLight() {
    const group = new THREE.Group();
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 10), new THREE.MeshPhongMaterial({ color: 0x333 }));
    pole.position.y = 5;
    group.add(pole);

    const box = new THREE.Mesh(new THREE.BoxGeometry(2, 5, 1.5), new THREE.MeshPhongMaterial({ color: 0x111 }));
    box.position.set(0, 8, 0);
    group.add(box);

    const colors = [0x550000, 0x555500, 0x005500];
    for (let i = 0; i < 3; i++) {
        let light = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), new THREE.MeshBasicMaterial({ color: colors[i] }));
        light.position.set(0, 9.3 - i * 1.3, 0.8);
        group.add(light);
        trafficLightLights.push(light);
    }

    group.position.set(trackRadius + 25, 0, 0);
    scene.add(group);
}

function setupControls() {
    const bindBtn = (id, onPress, onRelease) => {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); onPress(); });
        el.addEventListener('touchend', (e) => { e.preventDefault(); onRelease(); });
        el.addEventListener('mousedown', onPress);
        el.addEventListener('mouseup', onRelease);
    };

    bindBtn('leftBtn', () => moveLeft = true, () => moveLeft = false);
    bindBtn('rightBtn', () => moveRight = true, () => moveRight = false);
    bindBtn('gasBtn', () => isGas = true, () => isGas = false);
    bindBtn('brakeBtn', () => isBrake = true, () => isBrake = false);

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') moveLeft = true;
        if (e.key === 'ArrowRight') moveRight = true;
        if (e.key === 'ArrowUp') isGas = true;
        if (e.key === 'ArrowDown') isBrake = true;
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') moveLeft = false;
        if (e.key === 'ArrowRight') moveRight = false;
        if (e.key === 'ArrowUp') isGas = false;
        if (e.key === 'ArrowDown') isBrake = false;
    });
}

function updateAI() {
    aiCars.forEach(ai => {
        ai.aiAngle += ai.aiSpeed;
        ai.position.x = Math.cos(ai.aiAngle) * ai.laneRadius;
        ai.position.z = Math.sin(ai.aiAngle) * ai.laneRadius;
        ai.rotation.y = -ai.aiAngle + Math.PI / 2;
    });
}

function finishGame() {
    raceStarted = false;
    const modal = document.getElementById('resultModal');
    const emojiEl = document.getElementById('resultEmoji');
    const titleEl = document.getElementById('resultTitle');
    const msgEl = document.getElementById('resultMessage');

    if (playerRank === 1) {
        emojiEl.innerText = "🥳👉🏆";
        titleEl.innerText = "المركز الأول! (الفائز)";
        msgEl.innerText = "أداء خيالي وسواقة محترفة بدون أي خطأ!";
    } else if (playerRank === 2) {
        emojiEl.innerText = "😎🥈";
        titleEl.innerText = "المركز الثاني!";
        msgEl.innerText = "أداء ممتاز ومنافسة قوية!";
    } else if (playerRank === 3) {
        emojiEl.innerText = "👍🥉";
        titleEl.innerText = "المركز الثالث!";
        msgEl.innerText = "على منصة التتويج! عاش!";
    } else {
        emojiEl.innerText = "😢💔";
        titleEl.innerText = "المركز الرابع";
        msgEl.innerText = "حظاً أوفَر في المرة القادمة!";
    }

    modal.style.display = 'flex';
}

function animate() {
    requestAnimationFrame(animate);

    if (raceStarted) {
        if (isGas) speed += acceleration;
        else if (isBrake) speed -= acceleration * 0.8;
        else speed *= friction;

        speed = Math.max(-maxSpeed * 0.3, Math.min(maxSpeed, speed));

        if (Math.abs(speed) > 0.01) {
            let dir = speed > 0 ? 1 : -1;
            if (moveLeft) playerCar.rotation.y += 0.028 * dir;
            if (moveRight) playerCar.rotation.y -= 0.028 * dir;
        }

        const prevPos = playerCar.position.clone();
        playerCar.translateZ(-speed);

        const dist = playerCar.position.distanceTo(new THREE.Vector3(0, 0, 0));
        if (dist < innerRadius + 2.5 || dist > outerRadius - 2.5) {
            playerCar.position.copy(prevPos);
            speed = -speed * 0.3;
        }

        updateAI();

        // حساب المسافة الدقيقة والزاوية الحقيقية
        let currentAngle = Math.atan2(playerCar.position.z, playerCar.position.x);
        let diffAngle = currentAngle - lastPlayerAngle;

        if (diffAngle < -Math.PI) diffAngle += Math.PI * 2;
        if (diffAngle > Math.PI) diffAngle -= Math.PI * 2;

        playerProgress += diffAngle;
        lastPlayerAngle = currentAngle;

        let calculatedLap = Math.floor(playerProgress / (Math.PI * 2)) + 1;
        if (calculatedLap > currentLap && calculatedLap <= totalLaps) {
            currentLap = calculatedLap;
            document.getElementById('lapVal').innerText = currentLap + " / " + totalLaps;
        } else if (calculatedLap > totalLaps) {
            finishGame();
        }

        // حساب الترتيب بدقة متناهية مقارنة بتقدم السيارات الأخرى
        playerRank = 1;
        aiCars.forEach(ai => {
            if (ai.aiAngle > playerProgress) playerRank++;
        });
        document.getElementById('posVal').innerText = playerRank + " / 4";

        document.getElementById('speedVal').innerText = Math.round(Math.abs(speed) * 110) + " كم/س";
    }

    const camOffset = new THREE.Vector3(0, 5, 11).applyAxisAngle(new THREE.Vector3(0, 1, 0), playerCar.rotation.y);
    camera.position.copy(playerCar.position).add(camOffset);
    camera.lookAt(playerCar.position.clone().add(new THREE.Vector3(0, 1, -5).applyAxisAngle(new THREE.Vector3(0, 1, 0), playerCar.rotation.y)));

    renderer.render(scene, camera);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

window.onload = init;
</script>
</body>
</html>
